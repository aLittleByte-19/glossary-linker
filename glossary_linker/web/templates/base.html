<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Glossary Linker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script defer src="{{ url_for('static', filename='picker.js') }}"></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="{{ url_for('operation') }}">
        <strong>Glossary Linker</strong>
        <span>Wizard locale per documenti LaTeX</span>
      </a>
      <nav class="top-actions" aria-label="Azioni principali">
        <a class="icon-link" href="{{ url_for('settings') }}" aria-label="Impostazioni">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"></path>
            <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.04.04a2.06 2.06 0 0 1-2.91 2.91l-.04-.04a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56V21a2.06 2.06 0 0 1-4.12 0v-.06A1.7 1.7 0 0 0 8.8 19.4a1.7 1.7 0 0 0-1.88.34l-.04.04a2.06 2.06 0 1 1-2.91-2.91l.04-.04A1.7 1.7 0 0 0 4.35 15a1.7 1.7 0 0 0-1.56-1.03H2.7a2.06 2.06 0 0 1 0-4.12h.06A1.7 1.7 0 0 0 4.35 8.8a1.7 1.7 0 0 0-.34-1.88l-.04-.04a2.06 2.06 0 0 1 2.91-2.91l.04.04A1.7 1.7 0 0 0 8.8 4.35a1.7 1.7 0 0 0 1.03-1.56V2.7a2.06 2.06 0 0 1 4.12 0v.06a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.88-.34l.04-.04a2.06 2.06 0 0 1 2.91 2.91l-.04.04a1.7 1.7 0 0 0-.34 1.88 1.7 1.7 0 0 0 1.56 1.03H21a2.06 2.06 0 0 1 0 4.12h-.06A1.7 1.7 0 0 0 19.4 15Z"></path>
          </svg>
        </a>
      </nav>
    </header>
    <main class="shell">
      {% block progress %}{% endblock %}
      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <section class="notice" aria-live="polite">
            {% for message in messages %}
              <p>{{ message }}</p>
            {% endfor %}
          </section>
        {% endif %}
      {% endwith %}
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
