<tr data-entry data-entry-id="{{ entry.id }}" data-entry-term="{{ entry.term | lower }}">
  <td>
    <strong>{{ entry.term }}</strong>
    <code>{{ entry.id }}</code>
    <input type="hidden" name="entry_id" value="{{ entry.id }}">
  </td>
  <td>{{ entry.definition or "Nessuna definizione rilevata." }}</td>
  <td><input class="alias-input" name="aliases_{{ entry.id }}" value="{{ entry.aliases | join(', ') }}" placeholder="alias separati da virgola" aria-label="Alias per {{ entry.term }}"></td>
  <td>
    <label class="switch">
      <input type="checkbox" name="mode_{{ entry.id }}" value="manual" {% if entry.mode == "manual" %}checked{% endif %} data-mode-switch>
      <span></span>
      <em data-mode-label>{% if entry.mode == "manual" %}Manuale{% else %}Automatico{% endif %}</em>
    </label>
  </td>
</tr>
