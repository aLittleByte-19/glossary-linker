glossary_html_url: https://alittlebyte-19.github.io/Documentazione/glossario.html
html_anchor_format: '#gls-{id}'
glossary_detection: auto
glossary_custom_command: ''
glossary_structure_description: Rileva automaticamente il comando LaTeX piu probabile
  oppure usa \subsection{Termine}.
excluded_entry_ids: []
exclude_file_patterns:
- '*.linked.tex'
- '**/build/**'
- '**/output/**'
- '**/dist/**'
- '**/tmp/**'
- '**/prove/**'
- '**/bozze/**'
- '**/prompt/**'
- '**/prompt.tex'
- '**/*prompt*.tex'
- '**/*prova*.tex'
- '**/*bozza*.tex'
ignored_environments:
- verbatim
- lstlisting
- minted
- listing
- code
ignored_commands:
- href
- url
- glslink
- part
- chapter
- section
- subsection
- subsubsection
- paragraph
- subparagraph
- title
- author
- date
- caption
ignored_sections:
- indice
- frontespizio
entries: {}
